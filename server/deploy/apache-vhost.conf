# ULTIMATE PS LIBRARY — Apache 2.4 virtual host (tested with Apache 2.4 + PHP-FPM 8.3)
# Modules: rewrite, headers, proxy_fcgi, setenvif, ssl (optional: deflate, xsendfile)
#   a2enmod rewrite headers proxy_fcgi setenvif ssl deflate
<VirtualHost *:80>
    ServerName library.example.com
    # Everything goes to HTTPS
    Redirect permanent / https://library.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName library.example.com
    DocumentRoot /var/www/ultimate-ps-library/server/public
    <Directory /var/www/ultimate-ps-library/server/public>
        AllowOverride All
        Require all granted
    </Directory>

    # PHP through PHP-FPM (skip this block if you use mod_php)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    # Uploaded media must never run as PHP, whatever the handler
    <Directory /var/www/ultimate-ps-library/server/public/media>
        <FilesMatch "\.(php\d?|phtml|phar|pht)$">
            SetHandler none
            Require all denied
        </FilesMatch>
    </Directory>
    # Pass the Authorization header (API bearer tokens) to PHP-FPM
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Chunk size is 5 MB by default: 64 MB leaves room for multipart overhead
    LimitRequestBody 67108864
    # Large chunk uploads / slow clients
    Timeout 300

    # Optional: faster downloads with mod_xsendfile (then set 'x_sendfile' => 'apache' in config.php)
    # XSendFile On
    # XSendFilePath /var/www/ultimate-ps-library/server/storage/files

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/library.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/library.example.com/privkey.pem
</VirtualHost>
