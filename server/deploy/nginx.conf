# ULTIMATE PS LIBRARY — nginx + PHP-FPM example
server {
    listen 80;
    server_name library.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name library.example.com;
    root /var/www/ultimate-ps-library/server/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/library.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.example.com/privkey.pem;

    # chunks are ~5-8 MB; images/imports up to 30 MB through classic forms
    client_max_body_size 64m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ~ /\.(?!well-known) { deny all; }

    location ^~ /media/ {
        location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        try_files $uri =404;
    }
    location ^~ /assets/ { expires 30d; access_log off; try_files $uri =404; }

    # Fast downloads with X-Accel-Redirect (set storage.x_sendfile => 'nginx' in config.php)
    location ^~ /protected-files/ {
        internal;
        alias /var/www/ultimate-ps-library/server/storage/files/;
    }

    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 600s;
        fastcgi_request_buffering off;   # stream chunk uploads
    }
    location = /install.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/install.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { deny all; }
}
