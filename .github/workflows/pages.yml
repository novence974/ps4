# GitHub Pages sends visitors to the live library (the full PHP site on alwaysdata),
# keeping the page they asked for: https://OWNER.github.io/REPO/game/x → LIVE_URL/game/x.
# Change the address in Settings > Secrets and variables > Actions > Variables: LIVE_SITE_URL.
# (The old static demo export is still available: tools/export_static.sh.)
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL || 'https://novence.alwaysdata.net' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the redirect pages
        run: |
          repo="${{ github.event.repository.name }}"
          if [ "$repo" = "${{ github.repository_owner }}.github.io" ]; then base=""; else base="/$repo"; fi
          target="${LIVE_SITE_URL%/}"
          case "$target" in https://*) ;; *) echo "LIVE_SITE_URL must start with https://" >&2; exit 1 ;; esac
          mkdir -p _site
          sed -e "s#__TARGET__#$target#g" -e "s#__BASE__#$base#g" tools/static/redirect.html > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
