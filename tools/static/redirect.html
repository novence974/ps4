<meta http-equiv="refresh" content="0; url=__TARGET__/">
<script>
  // keep the page the visitor asked for: /ps4/game/x → __TARGET__/game/x
  (function () {
    var base = '__BASE__', p = location.pathname;
    if (base && p.indexOf(base) === 0) p = p.slice(base.length);
    p = p.replace(/\/index\.html$/, '/').replace(/\/+$/, '') || '';
    location.replace('__TARGET__' + p + location.search + location.hash);
  })();
</script>
